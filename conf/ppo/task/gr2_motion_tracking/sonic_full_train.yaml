# @package _global_
#
# Fourier GR2 SONIC from-scratch training with the fixed-head 27-DoF profile.
# The env emits obs=1470 (encoder 600 + proprio 870) and a 1545-d privileged critic.
training:
  task_name: GR2SonicMotionTracking
  sim_backend: mujoco
  play_steps: 1000
algo:
  num_envs: 1024
  max_iterations: 15000
  save_interval: 500
  obs_groups:
    actor:
      - actor
    critic:
      - critic
  actor:
    class_name: unilab.algos.torch.sonic:SonicGR2ActorModel
    enc_group: actor
    proprio_group: null
    enc_dim: 600
    proprio_dim: 870
    use_fsq: true
    with_kin_aux: false
    freeze_encoder: false
    obs_normalization: false
    pretrained_ckpt: null
    distribution_cfg:
      class_name: GaussianDistribution
      init_std: 0.5
      std_type: scalar
  critic:
    class_name: unilab.algos.torch.sonic:SonicCriticModel
    hidden_dims: [2048, 2048, 1024, 1024, 512, 512]
    activation: swish
    obs_normalization: true
  algorithm:
    entropy_coef: 0.005
env:
  sim_dt: 0.005
  critic_privileged_mf_hist: true
  mujoco_to_isaaclab_perm: false
  action_output_isaaclab_to_mujoco: false
  strict_foot_pos_threshold: 0.5
  strict_anchor_ori_error_sq: 0.8
  strict_height_threshold: 0.45
reward:
  scales:
    motion_global_root_pos: 0.5
    motion_global_root_ori: 0.5
    motion_body_pos: 1.0
    motion_body_ori: 1.0
    motion_body_lin_vel: 1.0
    motion_body_ang_vel: 1.0
    motion_joint_pos: 0.0
    motion_joint_vel: 0.0
    motion_local_points: 2.0
    undesired_contacts: -0.1
    action_rate_l2: -0.01
    joint_limit: -10.0
    feet_slide: 0.0
    feet_yaw: 0.0
    joint_acc_l2: -2.5e-7
    joint_torque_l2: -1.0e-6
    anti_shake_ang_vel: -5.0e-3
  std_root_pos: 0.3
  std_root_ori: 0.4
  std_body_pos: 0.3
  std_body_ori: 0.4
  std_body_lin_vel: 1.0
  std_body_ang_vel: 3.14
  std_joint_pos: 0.2
  std_joint_vel: 1.0
play_profile:
  enabled: true
  env:
    render_spacing: 2.0

# @package _global_
#
# SONIC H2 from-scratch full-train task: H2SonicMotionTracking env (29-DOF, head welded
# like Unitree G1) + sonic H2 encoder(+FSQ)+decoder actor + privileged_mf_hist critic.
# Forked from g1_motion_tracking/sonic_full_train.yaml. Launch via scripts/sonic/full_train_h2.sh
# (passes +env.critic_privileged_mf_hist=true and +env.motion_file=[...]).
#
# The env emits a single 1570-dim actor stream ``obs`` = enc(640) ++ proprio(930);
# SonicH2ActorModel splits it internally (proprio_group=null). Critic = 1645
# privileged_mf_hist (enabled by the launcher override), trained fresh.
training:
  task_name: H2SonicMotionTracking
  sim_backend: mujoco
  play_steps: 1000
algo:
  num_envs: 1024
  max_iterations: 15000
  save_interval: 500
  obs_groups:
    actor:
      - actor        # the 1570-dim env "obs" stream (mapped to tensordict key "actor")
    critic:
      - critic       # 1645-dim privileged_mf_hist critic
  actor:
    class_name: unilab.algos.torch.sonic:SonicH2ActorModel
    enc_group: actor         # single combined stream ...
    proprio_group: null      # ... split internally into enc(640) + proprio(930)
    enc_dim: 640
    proprio_dim: 930
    use_fsq: true
    with_kin_aux: false
    freeze_encoder: false
    obs_normalization: false
    pretrained_ckpt: null    # H2 trains from scratch (no last.pt in H2 joint layout)
    distribution_cfg:
      class_name: GaussianDistribution
      init_std: 0.5
      std_type: scalar
  critic:
    # SonicCriticModel == stock MLPModel when pretrained_ckpt is unset (fresh critic).
    # With env.critic_privileged_mf_hist=true the critic obs is the 1645-d H2
    # privileged_mf_hist layout (joint blocks in MuJoCo order, self-consistent for a
    # fresh critic). Same 6-layer SiLU net as G1 full-train.
    class_name: unilab.algos.torch.sonic:SonicCriticModel
    hidden_dims: [2048, 2048, 1024, 1024, 512, 512]
    activation: swish
    obs_normalization: true
  algorithm:
    entropy_coef: 0.005
env:
  sim_dt: 0.005
  # 1645-d privileged_mf_hist critic (declared so the launcher can set it without +).
  critic_privileged_mf_hist: true
  # from-scratch: single MuJoCo joint order (no last.pt reuse)
  mujoco_to_isaaclab_perm: false
  action_output_isaaclab_to_mujoco: false
  # loosened strict terminators for a cold policy (anneal back once ep-len climbs)
  # P1 anneal @ iter~3k (ep-len ~295): tighten upright/height tracking to kill the
  # forward-lean + turning drift. Tighten in steps; if ep-len collapses, back off.
  strict_foot_pos_threshold: 0.5
  strict_anchor_ori_error_sq: 0.6     # 0.7 -> 0.6
  strict_height_threshold: 0.4       # 0.45 -> 0.4
reward:
  scales:
    # P2: up-weight global root pos/ori (heading & where-it-walks) — these were the
    # lowest-tracking terms and govern the walk-off / turning; body_pos already ~0.87.
    motion_global_root_pos: 0.75   # 0.5 -> 0.75
    motion_global_root_ori: 0.75   # 0.5 -> 0.75
    motion_body_pos: 1.0
    motion_body_ori: 1.0
    motion_body_lin_vel: 1.0
    motion_body_ang_vel: 1.0
    motion_joint_pos: 0.0
    motion_joint_vel: 0.0
    action_rate_l2: -0.03          # -0.01 -> -0.03  (ep-len>100, add smoothness vs jitter)
    joint_limit: -10.0
    # Curriculum terms (launcher enables from stage 2.5): target_rate_l2 penalizes the
    # physical PD-target change (action_scale·Δaction, replaces action_rate_l2 once stable);
    # upper_body_joint_pos tracks the 14 shoulder/elbow/wrist joints. Default 0.0 = OFF.
    target_rate_l2: 0.0
    upper_body_joint_pos: 0.0
    # Foot-slip / foot-yaw penalties (the policy drags / free-spins the support foot on
    # turns, wrecking root and motion_body_ang_vel tracking). Declared here so
    # per-run CLI (reward.scales.feet_slide=... ) can override; default 0.0 = OFF.
    feet_slide: 0.0
    feet_yaw: 0.0
    # Smoothness terms (launcher overrides these per stage). Must be declared here so the
    # composed reward.scales struct contains the keys for CLI override.
    joint_acc_l2: -2.5e-7
    joint_torque_l2: -1.0e-6
    anti_shake_ang_vel: -5.0e-3
    # Soft joint-limit penalty (enabled per stage by the launcher): linear excess beyond the
    # centred soft_joint_limit_factor of each joint range, so the policy stops leaning on
    # the rigid joint stops (ankle roll / knee hyperextension). Default 0.0 = OFF.
    joint_soft_limit: 0.0
    # PD-target-beyond-hard-range penalty: keeps a gradient while a joint
    # rests on its stop, where joint_soft_limit is flat. Default 0.0 = OFF.
    joint_target_limit: 0.0
  std_root_pos: 0.3
  std_root_ori: 0.4
  std_body_pos: 0.3
  std_body_ori: 0.4
  std_body_lin_vel: 1.0
  std_body_ang_vel: 3.14
  std_joint_pos: 0.2
  std_upper_body_joint_pos: 0.2
  soft_joint_limit_factor: 0.95
  std_joint_vel: 1.0
play_profile:
  enabled: true
  env:
    render_spacing: 2.0

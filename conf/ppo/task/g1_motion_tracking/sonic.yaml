# @package _global_
#
# SONIC V2 finetune task: G1SonicMotionTracking env (task-3 obs: multi-future
# command + proprio history, pelvis anchor) + sonic G1 encoder(+FSQ)+decoder actor
# (task-2) + stock MLP critic. Run:
#   HF_ENDPOINT=https://hf-mirror.com uv run --no-sync train \
#     --algo ppo --task g1_motion_tracking --sim mujoco training.device=xpu \
#     task=g1_motion_tracking/sonic env.motion_file=<bones_seed.npz>
#
# The env emits a single 1570-dim actor stream ``obs`` = enc(640) ++ proprio(930);
# SonicG1ActorModel splits it internally (proprio_group=null). Critic = stock 286.
training:
  task_name: G1SonicMotionTracking
  sim_backend: mujoco
  play_steps: 1000
algo:
  num_envs: 1024
  max_iterations: 15000
  save_interval: 500
  obs_groups:
    actor:
      - actor        # the 1570-dim env "obs" stream (mapped to tensordict key "actor")
    critic:
      - critic       # stock 286-dim BeyondMimic critic
  actor:
    class_name: unilab.algos.torch.sonic:SonicG1ActorModel
    enc_group: actor         # single combined stream ...
    proprio_group: null      # ... split internally into enc(640) + proprio(930)
    enc_dim: 640
    proprio_dim: 930
    use_fsq: true            # task-5 no-FSQ baseline: set false
    with_kin_aux: false      # set true + fork PPO for sonic g1_recon aux loss
    # freeze_encoder: false = finetune BOTH encoder+decoder (redefines the 64-d FSQ
    # token space → existing VLA breaks, must be retrained). Set true to finetune the
    # decoder ONLY and keep the token space fixed (VLA-compat red line).
    freeze_encoder: false
    obs_normalization: false # sonic encoder trained on raw obs; keep off for finetune
    # WARM-START from sonic_release/last.pt (byte-compat verified via parity_harness).
    # Revert to from-scratch on the CLI: algo.actor.pretrained_ckpt=null
    #   algo.actor.distribution_cfg.init_std=1.0 +env.action_output_isaaclab_to_mujoco=false
    pretrained_ckpt: /home/maozhong/work/sonic_vla_infer/GR00T-WholeBodyControl-ov/sonic_release/last.pt
    distribution_cfg:
      class_name: GaussianDistribution
      init_std: 0.05         # mirror sonic's trained std (small exploration for warm-start)
      std_type: scalar
  critic:
    # Byte-exact official critic, WARM-LOADED from last.pt's value_state_dict so there is
    # NO cold critic. Requires env.critic_privileged_mf_hist=true (1645-d value obs) below.
    # Arch = official: MLP [2048,2048,1024,1024,512,512] SiLU + RunningMeanStd(obs_norm).
    # SonicCriticModel = stock MLPModel + a pretrained_ckpt hook (mirrors the actor).
    # Revert to a fresh critic on the CLI: algo.critic.pretrained_ckpt=null (and optionally
    # +algo.algorithm.critic_warmup_iters=... for the burn-in path).
    class_name: unilab.algos.torch.sonic:SonicCriticModel
    hidden_dims: [2048, 2048, 1024, 1024, 512, 512]
    activation: swish   # rsl_rl key for SiLU (official critic activation)
    obs_normalization: true
    pretrained_ckpt: /home/maozhong/work/sonic_vla_infer/GR00T-WholeBodyControl-ov/sonic_release/last.pt
  algorithm:
    entropy_coef: 0.005
# Warm-start needs the action-side IsaacLab→MuJoCo remap so the pretrained decoder
# (IsaacLab-order output) drives the right joints. Keeps this task config internally
# consistent; motion_file is still appended at launch via +env.motion_file=[...].
env:
  sim_dt: 0.005
  action_output_isaaclab_to_mujoco: true
  # Byte-exact official value obs: rebuild "critic" as the 1645-d privileged_mf_hist
  # vector so last.pt's official critic (value_state_dict, first layer (2048,1645)) can be
  # warm-loaded -> no cold critic. Supersedes the 926-d Level-A path (critic_include_future
  # is ignored when this is on). Joint blocks use IsaacLab order via the actor's
  # mujoco_to_isaaclab_perm=true (already set for warm), matching the loaded critic.
  critic_privileged_mf_hist: true
reward:
  scales:
    motion_global_root_pos: 0.5
    motion_global_root_ori: 0.5
    motion_body_pos: 1.0
    motion_body_ori: 1.0
    motion_body_lin_vel: 1.0
    motion_body_ang_vel: 1.0
    motion_joint_pos: 0.0
    motion_joint_vel: 0.0
    motion_local_points: 2.0
    action_rate_l2: -0.1
    joint_limit: -10.0
    undesired_contacts: -0.1
  std_root_pos: 0.3
  std_root_ori: 0.4
  std_body_pos: 0.3
  std_body_ori: 0.4
  std_body_lin_vel: 1.0
  std_body_ang_vel: 3.14
  std_joint_pos: 0.2
  std_joint_vel: 1.0
  std_local_points: 0.1
play_profile:
  enabled: true
  env:
    render_spacing: 2.0

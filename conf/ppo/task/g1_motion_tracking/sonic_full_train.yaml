# @package _global_
#
# SONIC V2 finetune task: G1SonicMotionTracking env (task-3 obs: multi-future
# command + proprio history, pelvis anchor) + sonic G1 encoder(+FSQ)+decoder actor
# (task-2) + stock MLP critic. Run:
#   HF_ENDPOINT=https://hf-mirror.com uv run --no-sync train \
#     --algo ppo --task g1_motion_tracking --sim mujoco training.device=xpu \
#     task=g1_motion_tracking/sonic env.motion_file=<bones_seed.npz>
#
# The env emits a single 1570-dim actor stream ``obs`` = enc(640) ++ proprio(930);
# SonicG1ActorModel splits it internally (proprio_group=null). Critic = stock 286.
training:
  task_name: G1SonicMotionTracking
  sim_backend: mujoco
  play_steps: 1000
algo:
  num_envs: 1024
  max_iterations: 15000
  save_interval: 500
  obs_groups:
    actor:
      - actor        # the 1570-dim env "obs" stream (mapped to tensordict key "actor")
    critic:
      - critic       # stock 286-dim BeyondMimic critic
  actor:
    class_name: unilab.algos.torch.sonic:SonicG1ActorModel
    enc_group: actor         # single combined stream ...
    proprio_group: null      # ... split internally into enc(640) + proprio(930)
    enc_dim: 640
    proprio_dim: 930
    use_fsq: true            # task-5 no-FSQ baseline: set false
    with_kin_aux: false      # set true + fork PPO for sonic g1_recon aux loss
    freeze_encoder: false    # true to keep FSQ token space fixed (VLA-compat red line)
    obs_normalization: false # sonic encoder trained on raw obs; keep off for finetune
    pretrained_ckpt: null    # set to sonic_release/last.pt to warm-start G1 weights
    distribution_cfg:
      class_name: GaussianDistribution
      init_std: 0.5          # was 1.0 (official) but at std~1 the action_rate noise
                             # floor (~-5) makes per-step reward net-negative -> agent
                             # learns to die fast. 0.5 quarters that floor. Anneal up later.
      std_type: scalar
  critic:
    # Level-A critic (see G1SonicMotionTrackingCfg.critic_include_future): the value net
    # consumes 926 = 286 privileged body state + 640 multi-future command+anchor (mf, F=10).
    # EXP1+2: enlarged toward SONIC's official from-scratch critic. The official bones_seed
    # critic is [4096,4096,2048,2048,1024,1024,512,512] SiLU (8 layers); we use the 6-layer
    # [2048,2048,1024,1024,512,512] as the XPU-affordable step up from the 4-layer 1024 net
    # (that 4-layer net could not fit the value fn over 1000 diverse clips -> noisy
    # advantages -> non-convergence). obs_normalization=RunningMeanStd, as official.
    # NOTE: the 286 privileged body-state block is SINGLE-FRAME here; official adds hist=10
    # to it (privileged_mf_hist) -- that needs an env change, deferred. Shrink back to
    # [512,256,128]/elu (+critic_include_future=false) to A/B.
    class_name: rsl_rl.models.MLPModel
    hidden_dims: [2048, 2048, 1024, 1024, 512, 512]
    activation: swish   # rsl_rl key for SiLU (official critic activation)
    obs_normalization: true
  algorithm:
    entropy_coef: 0.005
env:
  # Match warm-start / SONIC deploy physics rate (200 Hz). The G1 base default is
  # 0.02/3 (~150 Hz); sonic_warm.yaml uses 0.005, so pin full-train here too to
  # keep dynamics identical across warm and full runs (control stays 50 Hz via
  # decimation 4).
  sim_dt: 0.005
  # --- from-scratch full-train: keep the joint interface self-consistent ------
  # Warm-start (sonic_warm.yaml) uses BOTH perms True so the pretrained last.pt
  # decoder (IsaacLab-order out) drives the right joints. For from-scratch we do
  # NOT reuse last.pt, so both sides are set to MuJoCo order (identity in/out):
  # obs joint terms and the action output share one order and the net does not
  # have to internalise a fixed 29-joint permutation. Both flags MUST flip
  # together — mixing them (True/False) is the awkward middle state.
  mujoco_to_isaaclab_perm: false
  action_output_isaaclab_to_mujoco: false
  # --- loosen SONIC's strict tracking-error terminators for from-scratch -------
  # The 0.2/0.2/0.30 defaults are calibrated for a warm-started policy that
  # already tracks; a cold policy trips foot-pos (0.2 m) almost immediately and
  # gets reset at ~26 steps (~0.5 s), never accumulating horizon. Loosened here;
  # anneal back toward 0.2/0.2/0.30 once mean episode length climbs (>100 steps).
  strict_foot_pos_threshold: 0.5        # 0.2 -> 0.5 m
  strict_anchor_ori_error_sq: 0.7       # 0.2 -> 0.7  (~47 deg pelvis ori error)
  strict_height_threshold: 0.45         # 0.30 -> 0.45 m
reward:
  scales:
    motion_global_root_pos: 0.5
    motion_global_root_ori: 0.5
    motion_body_pos: 1.0
    motion_body_ori: 1.0
    motion_body_lin_vel: 1.0
    motion_body_ang_vel: 1.0
    motion_joint_pos: 0.0
    motion_joint_vel: 0.0
    action_rate_l2: -0.01   # was -0.1; at std~1 the noise-dominated action_rate
                            # penalty (~-5) drove per-step reward net-negative and the
                            # agent learned to terminate ASAP. Anneal back to -0.05/-0.1
                            # for smoothness once episode length climbs past ~100 steps.
    joint_limit: -10.0
  std_root_pos: 0.3
  std_root_ori: 0.4
  std_body_pos: 0.3
  std_body_ori: 0.4
  std_body_lin_vel: 1.0
  std_body_ang_vel: 3.14
  std_joint_pos: 0.2
  std_joint_vel: 1.0
play_profile:
  enabled: true
  env:
    render_spacing: 2.0

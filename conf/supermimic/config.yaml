# SuperMimic (world model + BPTT) training root. Defaults reproduce the reference
# implementation's TrainConfig; the task owner YAML picks env, data and run size.
defaults:
  - _self_
  - task: h2_supermimic/mujoco

algo:
  algo_log_name: supermimic
  num_envs: 4096
  resume: null  # path to a ckpt_*.pt to continue from
  supermimic:
    seed: 0
    replay_capacity: 1000
    library_fp16: false
    world_model:
      hidden: [2048, 2048, 2048]
      term_hidden: [64, 64]
      term_loss_weight: 1.0
    wm_trainer:
      window: 8
      batches_per_update: 10
      batch_size: 2048
      lr: 2.0e-4
      grad_clip: 1.0
      compile: null  # "default" on CUDA / XPU
    policy:
      encoder_hidden: [2048, 1024, 512, 256]
      decoder_hidden: [2048, 1024, 512, 256]
      latent_dim: 32
      decoder_last_gain: 0.01
    critic:
      hidden: [256, 128]
    policy_trainer:
      horizon: 32
      batch_size: 4096
      gamma: 0.99
      gae_lambda: 0.95
      lr: 2.0e-4
      critic_lr: 2.0e-4
      critic_epochs: 5
      critic_minibatches: 4
      obs_noise: true
      compile: null  # "default" on CUDA / XPU
    schedule:
      total_iterations: 320000
      updates_per_env_step: 0.4
      policy_updates_per_wm_update: 1
      warmup_iterations: 40
      lr_final_ratio: 0.03
      lr_decay_fraction: 0.78125
      log_interval: 50
      checkpoint_interval: 4000
      max_hours: null
      lr_restart_iteration: null  # fine-tuning: LR warm restart from this iteration (see ScheduleCfg)
      lr_restart_peak_ratio: 0.2
      lr_restart_warmup_iterations: 2000

training:
  task_name: H2SuperMimic
  sim_backend: mujoco
  device: null  # cuda / xpu / cpu; auto when null
  log_root: null
  log_dir: null

env: {}

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
  job_logging:
    root:
      handlers: [console]

# @package _global_
# Small CPU-only smoke profile (pipeline check, not a training run): few envs and clips,
# narrow networks, short horizon.
training:
  task_name: H2SuperMimic
  sim_backend: mujoco
  device: cpu

algo:
  num_envs: 32
  supermimic:
    replay_capacity: 200
    world_model:
      hidden: [256, 256]
    wm_trainer:
      batches_per_update: 2
      batch_size: 256
    policy:
      encoder_hidden: [256, 128]
      decoder_hidden: [256, 128]
    policy_trainer:
      horizon: 8
      batch_size: 128
    schedule:
      total_iterations: 400
      warmup_iterations: 20
      log_interval: 50
      checkpoint_interval: 200

env:
  motion_dirs:
    - ~/work/sonic_vla_infer/bones_seed_3k_new/npz_h2_29dof_new
  motion_limit: 20
  sampling_mode: return
